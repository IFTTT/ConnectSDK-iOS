name: Build and run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test SDKHostApp scheme using any available iPhone simulator
    runs-on: macos-15
    env:
      SCHEME: SDKHostApp
      PROJECT: IFTTT SDK.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: |
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi

      - name: Pick iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '
                [ .devices
                  | to_entries[]
                  | select(.key | contains("iOS"))
                  | .value[]
                  | select((.name | startswith("iPhone")) and .isAvailable == true)
                ]
                | (.[0].udid // empty)
              ')
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
          | xcbeautify --renderer github-actions
